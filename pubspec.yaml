version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase dependencies - use latest compatible versions
  firebase_core: ^3.15.2
  firebase_auth: ^5.3.2
